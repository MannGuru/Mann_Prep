<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MannPrep AI Mentor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f9;
      display: flex;
      justify-content: center;
      height: 100vh;
      color: #1f1f1f;
    }
    .chat-container {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    /* Header */
    .chat-header {
      padding: 14px 18px;
      background: #ffffff;
      border-bottom: 1px solid #e8edf5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1a73e8, #6c5ce7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      box-shadow: 0 3px 10px rgba(26, 115, 232, 0.25);
    }
    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(90deg, #1b365d, #1a73e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-text span {
      font-size: 11px;
      color: #5f6368;
      display: block;
      margin-top: 1px;
    }
    .clear-btn {
      background: #f0f4f9;
      color: #1b365d;
      border: 1px solid #dce3ec;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .clear-btn:hover {
      background: #e2eaf4;
    }

    /* Chat Box */
    .chat-box {
      flex: 1;
      padding: 18px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .chat-box::-webkit-scrollbar {
      width: 6px;
    }
    .chat-box::-webkit-scrollbar-thumb {
      background: #d5dce6;
      border-radius: 10px;
    }

    /* Welcome Hero */
    .welcome-card {
      text-align: center;
      padding: 20px 12px 10px;
      animation: fadeIn 0.4s ease;
    }
    .welcome-card h2 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(90deg, #1a73e8, #8e44ad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .welcome-card p {
      font-size: 13.5px;
      color: #5f6368;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .chip {
      background: #f4f7fc;
      border: 1px solid #dce5f2;
      color: #1b365d;
      padding: 8px 13px;
      border-radius: 18px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover {
      background: #e8f0fe;
      border-color: #1a73e8;
      transform: translateY(-1px);
    }

    /* Messages */
    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: slideUp 0.25s ease;
    }
    .msg-row.user {
      justify-content: flex-end;
    }
    .ai-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a73e8, #6c5ce7);
      color: #fff;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg {
      padding: 11px 15px;
      border-radius: 18px;
      max-width: 82%;
      line-height: 1.6;
      font-size: 14.5px;
      word-wrap: break-word;
    }
    .user-msg {
      background: linear-gradient(135deg, #1b365d, #1a73e8);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
      box-shadow: 0 2px 8px rgba(26, 115, 232, 0.2);
    }
    .ai-msg {
      background: #f4f7fb;
      color: #1f1f1f;
      border: 1px solid #e6edf5;
      border-top-left-radius: 4px;
    }
    .ai-msg strong {
      color: #1b365d;
    }

    /* Thinking Dots */
    .thinking-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #5f6368;
      font-size: 13.5px;
      font-weight: 500;
    }
    .dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #1a73e8;
      border-radius: 50%;
      margin: 0 1.5px;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    /* Input Area */
    .input-wrapper {
      padding: 12px 16px 14px;
      background: #ffffff;
      border-top: 1px solid #eef2f7;
    }
    .input-pill {
      display: flex;
      align-items: center;
      background: #f0f4f9;
      border: 1.5px solid transparent;
      border-radius: 28px;
      padding: 6px 8px 6px 16px;
      transition: all 0.2s;
    }
    .input-pill:focus-within {
      background: #ffffff;
      border-color: #1a73e8;
      box-shadow: 0 2px 12px rgba(26, 115, 232, 0.14);
    }
    .input-pill input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14.5px;
      color: #1f1f1f;
      outline: none;
      font-family: inherit;
    }
    .input-pill button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1b365d, #1a73e8);
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
      flex-shrink: 0;
    }
    .input-pill button:hover {
      transform: scale(1.05);
    }
    .input-pill button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1.1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div class="brand-text">
          <h1>MannPrep AI Mentor</h1>
          <span>Defence • Delhi Police • SSC</span>
        </div>
      </div>
      <button class="clear-btn" onclick="clearChat()">+ New Chat</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="welcome-card" id="welcomeCard">
        <h2>Namaste, Aspirant! 👋</h2>
        <p>NDA, CDS, AFCAT, Agniveer, SSC ya Delhi Police exam se juda koi bhi sawaal Hindi, Hinglish ya English mein poochein.</p>
        <div class="chips">
          <button class="chip" onclick="quickAsk('Delhi Police Constable syllabus kya hai?')">Delhi Police Syllabus</button>
          <button class="chip" onclick="quickAsk('SSC GD physical standards batao')">SSC GD Physical</button>
          <button class="chip" onclick="quickAsk('NDA age limit and eligibility?')">NDA Eligibility</button>
          <button class="chip" onclick="quickAsk('दिल्ली पुलिस ड्राइवर की तैयारी कैसे करें?')">DP Driver तैयारी</button>
        </div>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-pill">
        <input type="text" id="userInput" placeholder="Ask..." autocomplete="off" />
        <button id="sendBtn" onclick="sendMessage()" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://defence-ai.yadavmanitandr.workers.dev";

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    let chatHistory = [];
    let isSending = false;

    userInput.addEventListener("keypress", function (e) {
      if (e.key === "Enter" && !isSending) sendMessage();
    });

    function formatText(text) {
      const escaped = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      return escaped
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^\s*[\*\-]\s+/gm, "• ")
        .replace(/\n/g, "<br>");
    }

    function hideWelcome() {
      const card = document.getElementById("welcomeCard");
      if (card) card.style.display = "none";
    }

    function addUserMessage(text) {
      const row = document.createElement("div");
      row.className = "msg-row user";
      const bubble = document.createElement("div");
      bubble.className = "msg user-msg";
      bubble.textContent = text;
      row.appendChild(bubble);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addAIMessage(htmlContent) {
      const row = document.createElement("div");
      row.className = "msg-row ai";

      const avatar = document.createElement("div");
      avatar.className = "ai-avatar";
      avatar.textContent = "✦";

      const bubble = document.createElement("div");
      bubble.className = "msg ai-msg";
      bubble.innerHTML = htmlContent;

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
      return bubble;
    }

    function quickAsk(question) {
      if (isSending) return;
      userInput.value = question;
      sendMessage();
    }

    function clearChat() {
      chatHistory = [];
      chatBox.innerHTML = `
        <div class="welcome-card" id="welcomeCard">
          <h2>Namaste, Aspirant! 👋</h2>
          <p>NDA, CDS, AFCAT, Agniveer, SSC ya Delhi Police exam se juda koi bhi sawaal Hindi, Hinglish ya English mein poochein.</p>
          <div class="chips">
            <button class="chip" onclick="quickAsk('Delhi Police Constable syllabus kya hai?')">Delhi Police Syllabus</button>
            <button class="chip" onclick="quickAsk('SSC GD physical standards batao')">SSC GD Physical</button>
            <button class="chip" onclick="quickAsk('NDA age limit and eligibility?')">NDA Eligibility</button>
            <button class="chip" onclick="quickAsk('दिल्ली पुलिस ड्राइवर की तैयारी कैसे करें?')">DP Driver तैयारी</button>
          </div>
        </div>
      `;
      userInput.focus();
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isSending) return;

      hideWelcome();
      isSending = true;
      sendBtn.disabled = true;
      userInput.disabled = true;

      addUserMessage(text);
      userInput.value = "";

      chatHistory.push({ role: "user", content: text });
      if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);

      const loadingBubble = addAIMessage(
        '<span class="thinking-wrap">Thinking <span class="dots"><span></span><span></span><span></span></span></span>'
      );

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: chatHistory }),
        });
        const data = await res.json();
        const replyText = data.reply || "Please try again.";
        loadingBubble.innerHTML = formatText(replyText);
        chatHistory.push({ role: "assistant", content: replyText });
        if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);
      } catch (err) {
        loadingBubble.textContent = "Connection error! Please try again.";
        chatHistory.pop();
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
  </script>
</body>
</html>
